---

name: Sync Release with Specfile
on:
  # Only release commits whose CI build succeeded
  workflow_run:
    workflows: ['Build RPMs and SRPMs']
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Rebuild and re-upload packages for all EL versions, even if the release already has them.'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-release:
    name: Sync Release
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # For workflow_run, github.sha is the branch head rather than the commit that was built
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.sync.outputs.tag }}
      publish: ${{ steps.sync.outputs.publish }}
      alma_versions: ${{ steps.sync.outputs.alma_versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Check that the CI build succeeded for this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          successful_builds=$(gh api "repos/${GH_REPO}/actions/workflows/build.yml/runs?head_sha=${TARGET_SHA}&status=success" --jq .total_count)
          if (( successful_builds == 0 )); then
            echo "::error::No successful 'Build RPMs and SRPMs' run found for ${TARGET_SHA}. Wait for the build to pass, or re-run it, before releasing."
            exit 1
          fi

      - name: Install rpmspec
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Check that this run is for the latest commit
        id: latest
        run: |
          # Prevents re-running an old workflow run from moving a release tag back to an older commit
          head_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
          if [[ "${head_sha}" != "${TARGET_SHA}" ]]; then
            echo "::notice::${TARGET_SHA} is no longer the head of main; skipping. Use 'Run workflow' to sync the latest commit instead."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync release with specfile changelog
        id: sync
        if: steps.latest.outputs.is_latest == 'true'
        env:
          # Keep in sync with the default matrix in publish.yml
          ALMA_VERSIONS: '8 9 10'
          FORCE_PUBLISH: ${{ inputs.force_publish || false }}
        run: bash .github/scripts/sync-release.sh

  # Releases created with GITHUB_TOKEN do not trigger other workflows,
  # so the publish workflow must be called directly.
  publish:
    name: Publish
    needs: sync-release
    if: needs.sync-release.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.sync-release.outputs.tag }}
      alma_versions: ${{ needs.sync-release.outputs.alma_versions }}
