---

name: Build and Publish RPM on Release
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag of the release to upload packages to.'
        required: true
        type: string
      alma_versions:
        description: 'JSON list of EL versions to build and upload, e.g. [8, 10].'
        required: false
        type: string
        default: '[8, 9, 10]'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: EL${{ matrix.alma_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        alma_version: ${{ fromJSON(inputs.alma_versions || '[8, 9, 10]') }}
    container:
      image: almalinux:${{ matrix.alma_version }}
    env:
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Build RPM and SRPM
        uses: ./.github/actions/build-rpm-and-srpm
        with:
          alma_version: ${{ matrix.alma_version }}

      - name: Install GitHub CLI
        run: |
          cat > /etc/yum.repos.d/gh-cli.repo << 'EOF'
          [gh-cli]
          name=packages for the GitHub CLI
          baseurl=https://cli.github.com/packages/rpm
          enabled=1
          gpgcheck=1
          gpgkey=https://cli.github.com/packages/githubcli-archive-keyring.asc
          EOF
          dnf install -y gh

      - name: Upload rpms to release
        run: |
          gh release upload "${TAG_NAME}" *.rpm --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload srpm to release
        run: |
          gh release upload "${TAG_NAME}" *.src.rpm --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
