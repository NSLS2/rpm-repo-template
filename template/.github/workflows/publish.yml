---

name: Build and Publish RPM on Release
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag of the release to upload packages to.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: EL${{ matrix.alma_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        alma_version: [8, 9, 10]
    container:
      image: almalinux:${{ matrix.alma_version }}
    env:
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Build RPM and SRPM
        uses: ./.github/actions/build-rpm-and-srpm
        with:
          alma_version: ${{ matrix.alma_version }}

      - name: Upload rpms to release
        run: |
          gh release upload "${TAG_NAME}" *.rpm --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload srpm to release
        run: |
          gh release upload "${TAG_NAME}" *.src.rpm --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
