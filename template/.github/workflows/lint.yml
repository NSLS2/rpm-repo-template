---

name: Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Pre-Commit Linter Checks
    runs-on: ubuntu-latest
    container:
      # EL10 + EPEL provides rpmlint 2.x, which reads .rpmlint.toml (EL9 ships incompatible 1.x)
      image: almalinux:10
      options: --user root

    steps:
      # git must be present before checkout so a real repo (with .git) is cloned for pre-commit
      - name: Install dependencies
        run: |
          dnf install -y epel-release
          dnf install -y git rpmlint

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: false
          frozen: true

      - name: Run linting checks
        run: pixi run lint
