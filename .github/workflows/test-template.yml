name: Test Template

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-template:
    name: Generate Test Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Copier reads the template from git history
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: false
          frozen: true

      - name: Generate test project
        run: pixi run generate-test-project
