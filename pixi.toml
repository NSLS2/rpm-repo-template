[workspace]
requires-pixi = ">=0.82.1"
authors = ["Jakub Wlodek <jwlodek@bnl.gov>"]
channels = ["conda-forge"]
name = "rpm-repo-template"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.generate-test-project]
cmd = """\
rm -rf build/test-project \
&& copier copy --defaults --trust --vcs-ref=HEAD \
--data package_name=test \
--data package_url=https://github.com/NSLS2/test \
--data 'package_description=Test package' \
--data package_version=1.0.0 \
--data 'author_name=CI User' \
--data author_email=ci@localhost \
. build/test-project \
&& cd build/test-project \
&& git init -q \
&& git add -A \
&& git -c user.name=ci -c user.email=ci@localhost commit -qm 'Initial commit'\
"""

[dependencies]
copier = ">=9.13.1,<10"
python = ">=3.13,<3.14"
